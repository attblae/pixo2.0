<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pixo</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        button {
          font-size: 30px;
          border: 5px solid #aba49e;
          background: #aba49e;
        }
        .post {
          position: relative;
          border: 10px solid #bcc1c5;
          border-radius: 20px;
          background: #bcc1c5;
          height: 500px;
          overflow: hidden;
        }
        .product {
          display: flex;
          justify-content: center;
          max-width: auto;
          height: 70%;
          /* background-color: red; */
        }
    </style>
</head>
<body class="background-white">
    <div class="header">
        <a href="/">pixo</a>
        <div class="right-part">
            <a href="/catalog">Catalog</a>
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
            <a href="#" onclick="toAccount()" style="color: white; text-decoration: underline; cursor: pointer">Account</a>
        </div>
    </div>
    <div class="content">
        <div class="input" style="margin-top: 10%;">
            <label for="file" class="custom-file-upload">
                Choose file
            </label>
            <input type="file" id="file" style="visibility:hidden;"/>
            <input type="text" placeholder="Price" id="price">
            <input type="text" placeholder="Title" id="title">
            <button onclick="upload()">Upload</button>
        </div>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script src="static/js/checkToken.js"></script>
    <script src="static/js/uploadPost.js"></script>
</body>
</html>
