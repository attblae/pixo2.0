<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PIXO</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="background-white">
    <div class="header">
        <a href="/">PIXO</a>
        <div class="right-part">
            <a href="/catalog">Catalog</a>
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
        </div>
    </div>
    <div class="content">
        <div class="input" style="margin-bottom: 3%">
            <input type="text" placeholder="Link" id="link">
            <input type="text" placeholder="Price" id="price">
            <button onclick="upload()">Upload</button>
        </div>
        <div class="body-post">
            <div class="post">
                <a href="..." class="product"><img src="static/images/imag.png" alt=""></a>
                <div class="product-text">
                    <p>500$</p>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script>
        const token = localStorage.getItem("token");
        document.addEventListener("DOMContentLoaded", async function () {
        if (!token) {
            window.location.href = "/login";
        } else {
            const response = await fetch("/check_token", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    access_token: token
                })
            });
            if (!response.ok) {
                localStorage.removeItem("token");
                window.location.href = "/login";
            }
        }
        });

        const link = document.getElementById("link").value
        const price = document.getElementById("price").value

        async function upload() {
            const response = await fetch("/uploading", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    link: link,
                    price: price
                })
            })
        const data = await response.json();}

    </script>
</body>
</html>
