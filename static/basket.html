<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pixo</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
            button {
                border: 5px solid #aba49e;
                background: #aba49e;
            }
            button:hover {
                background-color: #8f857c;
                border-color: #8f857c;
            }
    </style>
</head>
<body class="background-blue">
    <div class="header">
        <a href="/">pixo</a>
        <div class="right-part">
            <a href="/catalog">Catalog</a>
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
            <a href="#" onclick="toAccount()" style="color: white; text-decoration: underline; cursor: pointer">Account</a>
        </div>
    </div>
    <div class="content">
        <div class="header-account">
            <img src="../static/images/icon_account.jfif" alt="" style="width: 105px; border-radius: 20px; margin-left: 20px; cursor: pointer" onclick="toAccount()">
            <h3>{{ username }}</h3>
            <p> Art amount: {{ amount_art }}</p>
        </div>
        <div class="content">
            <ol class="products">
                {% for item in arts %}
                <li class="product-wrapper">
                    <div class="product"><img src="{{ item['photo_url']}}" alt="" style="border-radius: 20px"></div>
                    <div class="product-text">
                        <p style="font-family: Eden; font-size: 30px">{{ item["price"] }} $</p>
                        <p>artist: {{ item["author"] }}</p>
                    </div>
                    <div style="display: flex; justify-content: center; margin: 20px; gap: 10px;">
                        <button onclick="buying()">Buy</button>
                        <button onclick="postDeleting(this)" data-url="{{ item['photo_url']}}">Delete</button>
                    </div>
                </li>
                {% endfor %}
            </ol>
        </div>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script src="../static/js/checkToken.js"></script>
    <script src="../static/js/deleteBasketPost.js"></script>
    <script src="../static/js/goToAccount.js"></script>
    <script src="../static/js/buyPost.js"></script>
    </body>
</html>
