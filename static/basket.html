<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pixo</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
            button {
                border: 5px solid #aba49e;
                background: #aba49e;
            }
            button:hover {
                background-color: #8f857c;
                border-color: #8f857c;
            }
    </style>
</head>
<body class="background-blue">
    <div class="header">
        <a href="/">pixo</a>
        <div class="right-part">
            <a href="/catalog">Catalog</a>
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
        </div>
    </div>
    <div class="content">
        <div class="header-account">
            <img src="../static/images/imag.png" alt="" style="width: 5.25%; border-radius: 20px; margin-left: 20px; cursor: pointer" onclick="toAccount()">
            <h3>{{ username }}</h3>
            <p> Art amount: {{ amount_art }}</p>
            </div>
            <ol class="products">
                {% for item in arts %}
                <li class="product-wrapper">
                    <img src="{{ item['photo_url']}}" alt="" style="border-radius: 20px" class="product">
                    <div class="product-text">
                        <p style="font-family: Eden; font-size: 30px">{{ item["price"] }} $</p>
                        <p>artist: {{ item["author"] }}</p>
                    </div>
                    <div style="display: flex; justify-content: center; margin: 20px; gap: 10px;">
                        <button onclick="buying()">Buy</button>
                        <button onclick="postDeleting(this)" data-url="{{ item['photo_url']}}">Delete</button>
                    </div>
                </li>
                {% endfor %}
            </ol>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script>
        async function postDeleting(button) {
            const token = localStorage.getItem("token");
            const url = button.dataset.url;

            const response = await fetch("/delete_from_basket", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    access_token: token,
                    link: url
                })
            });

            if (response.ok) {
            const username = localStorage.getItem("username");
            window.location.href = `/basket/${username}`
            }
        }

        async function toAccount() {
            const username = localStorage.getItem("username");
            window.location.href = `/account/${username}`
        }

        async function buying() {
            if (window.confirm(`BUY an art \n Is your card correct? \n 1234123412341234`)) {
                window.alert("You have bought the art!!!")
            } else {
                card = window.prompt("Enter your valid card:")
                if (card) {
                    window.alert("You have bought the art!!!")
                }
            }
        }
    </script>
    </body>
</html>
