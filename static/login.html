<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pixo</title>
    <link rel="stylesheet" href="static/style.css">
        <style>
        button {
          font-size: 30px;
          border: 5px solid #aba49e;
          background: #aba49e;
        }
    </style>
</head>
<body class="background-white">
    <div class="header">
        <a href="/">pixo</a>
        <div class="right-part">
            <a href="/catalog">Catalog</a>
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
        </div>
    </div>
    <div class="content">
        <div class="input" style="margin-top: 10%;">
            <input type="text" placeholder="Username" id="username">
            <input type="password" placeholder="Password" id="password">
            <button onclick="check_user()">Login</button>
        </div>
        <p style="display: flex; align-items: center; justify-content: center; gap: 5px;">
            Don't have account?
            <a href="/create">Create account</a>
        </p>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script>
        async function check_user() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const response = await fetch("/login_account", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token)
                window.location.href = "/";
            } else {
                const data = await response.json();
                alert(data.message);
            };
        }
    </script>
</body>
</html>
