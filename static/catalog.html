<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pixo</title>
    <link rel="stylesheet" href="static/style.css">
        <style>
            button {
            border: 5px solid #aba49e;
            background: #aba49e;
            }
            button:hover {
                background-color: #8f857c;
                border-color: #8f857c;
                }
    </style>
</head>
<body class="background-blue">
    <div class="header">
        <a href="/">pixo</a>
        <div style="display: flex; gap: 5px; align-items: center; justify-content: center;">
            <input type="search" placeholder="Search..." id="search" style="margin-top: 5px;">
            <button style="height: 42px;">⌕</button>
        </div>
        <div class="right-part">
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
            <a href="/account" target="_blank">Account</a>
        </div>
    </div>
    <div class="content" style="padding-top: 5%;">
        <ol class="products">
            {% for item in arts %}
            <li class="product-wrapper">
                <a href="..." class="product"><img src="{{ item['photo_url']}}" alt=""></a>
                <div class="product-text">
                    <p style="font-family: Eden; font-size: 30px">{{ item["price"] }} $</p>
                    <p>artist: attblae</p>
                </div>
                <div style="display: flex; justify-content: center; margin: 20px; gap: 10px;">
                    <button>Buy now</button>
                    <button>Basket</button>
                </div>
            </li>
            {% endfor %}
        </ol>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
</body>
</html>
