<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pixo</title>
    <link rel="stylesheet" href="static/style.css">
        <style>
            button {
                border: 5px solid #aba49e;
                background: #aba49e;
            }
            button:hover {
                background-color: #8f857c;
                border-color: #8f857c;
            }

            input {
                background-color: #efe8de;
                border-color: #efe8de;
            }




            .buyingWindow {
              display: none;
              position: fixed;
              z-index: 3;
              left: 0;
              top: 0;
              width: 100%;
              height: 100%;
              overflow: auto;
              background-color: rgba(0, 0, 0, 0.4);
            }

            .content {
              /* some rules */
            }

            .close {
              /* some rules */
            }
    </style>
</head>
<body class="background-blue">
    <div class="header">
        <a href="/">pixo</a>
        <div style="display: flex; gap: 5px; align-items: center; justify-content: center;">
            <input type="search" placeholder="Search..." id="search" style="margin-top: 5px;">
            <button style="height: 42px;" onclick="search()">⌕</button>
        </div>
        <div class="right-part">
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
            <p onclick="toAccount()">Account</p>
        </div>
    </div>
    <div class="content" style="padding-top: 5%;">
        <ol class="products">
            {% for item in arts %}
            <li class="product-wrapper">
                <a href="..." class="product"><img src="{{ item['photo_url']}}" alt="" style="border-radius: 20px"></a>
                <div class="product-text">
                    <p style="font-family: Eden; font-size: 30px">{{ item["price"] }} $</p>
                    <p style="font-family: Eden; font-size: 30px">{{ item["title"] }}</p>
                    <p>artist: {{item["username"]}}</p>
                </div>
                <div style="display: flex; justify-content: center; margin: 20px; gap: 10px;">
                    <button onclick="buying(this)" data-url="{{ item['photo_url']}}">Buy now</button>
                    <button data-url="{{ item['photo_url']}}" data-username="{{ item['username']}}" onclick="sendToBasket(this)">
                        Basket
                    </button>
                </div>
<!--                <div class="buyingWindow" id="buyingWindow">-->
<!--                    <div class="content">-->
<!--                        <span class="close">×</span>-->
<!--                        <h2>Buy right now</h2>-->
<!--                        <p>Содержимое всплывающего окна</p>-->
<!--                    </div>-->
<!--                </div>-->
            </li>
            {% endfor %}
        </ol>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script>
        async function sendToBasket(button) {
            const token = localStorage.getItem("token");
            const url = button.dataset.url;

            if (!token) {
                window.location.href = "/login";
               }

            const response = await fetch("/put_in_basket", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    access_token: token,
                    link: url
                })
            });
        }

        async function buying(button) {
            if (window.confirm(`BUY an art \n Is your card correct? \n 1234123412341234`)) {
                window.alert("You have bought the art!!!")
            } else {
                card = window.prompt("Enter your valid card:")
                if (card) {
                    window.alert("You have bought the art!!!")
                }
            }
        }

        async function toAccount() {
            const username = localStorage.getItem("username");
            window.location.href = `/account/${username}`;
        }
        
        async function search() {
            const searchInfo = document.getElementById("search").value;
            if (!searchInfo) return;
            const url = `/catalog?search=${encodeURIComponent(searchInfo)}`;
            window.location.href = url;
        }
    </script>
</body>
</html>
