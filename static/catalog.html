<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pixo</title>
    <link rel="stylesheet" href="static/style.css">
        <style>
        .btn, button {
          color: #f1ead8;
          font-family: Eden;
          font-weight: bold;
          font-size: 25px;
          appearance: none;
          display: inline-block;
          width: auto;
          max-width: 200px;
          box-sizing: border-box;
          border: 0;
          border-radius: 15px;
          background: #aba49e;
          color: #25302c;
          font-size: 30px;
        }
    </style>
</head>
<body class="background-blue">
    <div class="header">
        <a href="/">pixo</a>
        <div class="right-part">
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
            <a href="/account" target="_blank">Account</a>
        </div>
    </div>
    <div class="content">
        <ol class="products">
            {% for item in arts %}
            <li class="product-wrapper">
                <a href="..." class="product"><img src="{{ item['photo_url']}}" alt=""></a>
                <div class="product-text">
                    <p style="font-family: Eden; font-size: 30px">{{ item["price"] }} $</p>
                    <p>artist: attblae</p>
                </div>
                <div style="display: flex; justify-content: center; margin: 20px; gap: 10px;">
                    <button>Buy now</button>
                    <button>Cart</button>
                </div>
            </li>
            {% endfor %}
        </ol>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
</body>
</html>
