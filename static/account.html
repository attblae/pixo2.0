<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PIXO</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="background">
    <div class="header">
        <a href="/">PIXO</a>
        <div class="right-part">
            <a href="/catalog">Catalog</a>
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
        </div>
    </div>
    <div class="content">
        <div class="header-account">
            <img src="static/images/imag.png" alt="" style="width: 10%;">
            <div style="display: flex; gap: 20px; padding-left: 20px; align-items: center;">
                <p>username</p>
                <p>amount art</p>
                <a href="/upload_post">upload new post</a>
            </div>
            <a href="/backet" style="display: flex; align-items: center; margin-left: 70%;">backet</a>
        </div>
        <div class="body-account">
            <ol class="products">
                <li class="posts">
                    <a href="..." class="product"><img src="static/images/imag.png" alt=""></a>
                    <div class="product-text">
                        <p>500$</p>
                    </div>
                </li>
                <li class="posts">
                    <a href="..." class="product"><img src="static/images/imag.png" alt=""></a>
                    <div class="product-text">
                        <p>500$</p>
                    </div>
                </li>
            </ol>
        </div>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script>
            document.addEventListener("DOMContentLoaded", async function () {
            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "/login";
            } else {
                const response = await fetch("/check_token", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        access_token: token
                    })
                });
                if (!response.ok) {
                    localStorage.removeItem("token");
                    window.location.href = "/login";
                }
            }
            
        });
    </script>
</body>
</html>
