<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pixo</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="background-blue">
    <div class="header">
        <a href="/">PIXO</a>
        <div class="right-part">
            <a href="/catalog">Catalog</a>
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
        </div>
    </div>
    <div class="content">
        <div class="header-account">
            <div style="display: flex; gap: 20px; padding-left: 20px; align-items: center;">
                <img src="static/images/imag.png" alt="" style="width: 15%;">
                <p>username</p>
                <p>amount art</p>
                <a href="/post">upload new post</a>
                <a href="/backet">backet</a>
            </div>
            <a href="/" style="padding-right: 20px" onclick="singOut()">sing out</a>
        </div>
        <div class="body-account">
            <ol class="products">
                {% for item in arts %}
                <li class="posts">
                    <a href="..." class="product"><img src="{{ item['photo_url']}}" alt=""></a>
                    <div class="product-text">
                        <p>{{ item['price'] }}$</p>
                    </div>
                </li>
                {% endfor %}
            </ol>
        </div>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script>
            document.addEventListener("DOMContentLoaded", async function () {
            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "/login";
            } else {
                const response = await fetch("/check_token", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        access_token: token
                    })
                });
                if (!response.ok) {
                    localStorage.removeItem("token");
                    window.location.href = "/login";
                }
            }
            
            });

            async function singOut() {
                const token = localStorage.getItem("token");
                localStorage.removeItem("token");
            }
    </script>
</body>
</html>
