<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PIXO</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="background">
    <div class="header">
        <a href="/">PIXO</a>
        <div class="right-part">
            <a href="/catalog">Catalog</a>
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
        </div>
    </div>
    <div class="content">
        <div class="input">
            <input type="text" placeholder="Username" id="username">
            <input type="password" placeholder="Password" id="password">
            <input type="text" placeholder="Name" id="name">
            <input type="text" placeholder="Surname" id="surname">
            <input type="text" placeholder="Patronymic" id="patronymic">
            <input type="text" placeholder="Email" id="email">
            <input type="text" placeholder="Pasport number" id="pasport">
            <input type="text" placeholder="Card" id="card">
            <button onblur="create_user()">Create account</button>
        </div>
    <p style="display: flex; align-items: center; justify-content: center;">Account had created?<a href="/login">Log in</a></p>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script>
        async function create_user() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const name = document.getElementById("name").value;
            const surname = document.getElementById("surname").value;
            const patronymic = document.getElementById("patronymic").value;
            const email = document.getElementById("email").value;
            const pasport = document.getElementById("pasport").value;
            const card = document.getElementById("card").value;

            const response = await fetch("/create_user", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        username: username,
                        password: password,
                        name: name,
                        surname: surname,
                        patronymic: patronymic,
                        email: email,
                        pasport: pasport,
                        card: card
                    })
                });
            if (response.ok) {
                window.location.href = "/";
            } else {
                const data = await response.json();
                alert(data.message)
            }
        }
    </script>
</body>
</html>
