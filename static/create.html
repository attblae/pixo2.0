<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pixo</title>
    <link rel="stylesheet" href="static/style.css">
        <style>
        .btn, button {
          color: #f1ead8;
          font-family: Eden;
          font-weight: bold;
          font-size: 25px;
          appearance: none;
          display: inline-block;
          width: auto;
          max-width: 200px;
          box-sizing: border-box;
          border: 0;
          border-radius: 15px;
          background: #aba49e;
          color: #25302c;
          font-size: 30px;
        }
    </style>
</head>
<body class="background-white">
    <div class="header">
        <a href="/">pixo</a>
        <div class="right-part">
            <a href="/catalog">Catalog</a>
            <a href="/support">Support</a>
            <a href="/about_us">About us</a>
        </div>
    </div>
    <div class="content">
        <div class="input" style="margin-top: 5%;">
            <input type="text" placeholder="Username" id="username">
            <input type="password" placeholder="Password" id="password">
            <input type="password" placeholder="Confirm password" id="password_confrim">
            <input type="text" placeholder="Name" id="name">
            <input type="text" placeholder="Surname" id="surname">
            <input type="text" placeholder="Patronymic" id="patronymic">
            <input type="text" placeholder="Phone" id="phone">
            <input type="text" placeholder="Email" id="email">
            <input type="text" placeholder="Pasport number" id="pasport">
            <input type="text" placeholder="Card" id="card">
            <button onclick="create_user()">Create account</button>
        </div>
    <p style="display: flex; align-items: center; justify-content: center; gap: 5px;">Account had created?<a href="/login">Log in</a></p>
    </div>
    <div class="footer">
        <a href="/">PIXO</a>
        <p>89999999999</p>
        <p>some information</p>
    </div>
    <script src="js/create_account.js"></script>

</html>
